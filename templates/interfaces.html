{{define "interfaces.html"}}
{{template "layout.html" .}}
{{end}}

{{define "content"}}
<div class="page-header">
    <h2>Interfaces & Network</h2>
    <p>Manage router interfaces, IP addresses, DHCP and DNS</p>
</div>

<div class="page-body">
    <!-- Router Selector -->
    <div class="card mb-4">
        <div class="card-body" style="display:flex; align-items:center; gap:12px;">
            <label class="form-label" style="margin:0; white-space:nowrap;">Select Router:</label>
            <select id="routerSelect" onchange="loadRouterData(this.value)" class="form-select" style="width:auto; min-width:200px;">
                <option value="">-- Select Router --</option>
                {{range .Routers}}
                <option value="{{.id}}" {{if eq (int .id) $.SelectedRouter}}selected{{end}}>{{.name}} ({{.host}})</option>
                {{end}}
            </select>
            <span id="connectionStatus" class="badge badge-gray"></span>
        </div>
    </div>

    <div id="interfaceContent" class="hidden">
        <!-- Interfaces -->
        <div class="card mb-4">
            <div class="card-header"><h3>Interfaces</h3></div>
            <div class="table-container">
                <table class="modern-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Type</th>
                            <th>MAC</th>
                            <th>MTU</th>
                            <th>Status</th>
                            <th class="text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="interfacesTable"></tbody>
                </table>
            </div>
        </div>

        <!-- IP Addresses -->
        <div class="card mb-4">
            <div class="card-header">
                <h3>IP Addresses</h3>
                <button onclick="showAddIPModal()" class="btn btn-primary btn-sm">
                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                    Add IP
                </button>
            </div>
            <div class="table-container">
                <table class="modern-table">
                    <thead>
                        <tr>
                            <th>Address</th>
                            <th>Interface</th>
                            <th>Network</th>
                            <th class="text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="ipAddressesTable"></tbody>
                </table>
            </div>
        </div>

        <!-- DNS -->
        <div class="card">
            <div class="card-header"><h3>DNS Settings</h3></div>
            <div class="card-body">
                <form onsubmit="updateDNS(event)" style="display:flex; flex-direction:column; gap:16px; max-width:480px;">
                    <div>
                        <label class="form-label">DNS Servers</label>
                        <input type="text" id="dnsServers" class="form-input" placeholder="8.8.8.8,1.1.1.1">
                    </div>
                    <div style="display:flex; align-items:center; gap:8px;">
                        <input type="checkbox" id="dnsAllowRemote">
                        <label for="dnsAllowRemote" style="font-size:13px; color:var(--text-secondary);">Allow Remote Requests</label>
                    </div>
                    <button type="submit" class="btn btn-primary" style="align-self:flex-start;">Update DNS</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Add IP Modal -->
<div id="ipModal" class="modal-overlay hidden">
    <div class="modal-content">
        <div class="modal-header"><h3>Add IP Address</h3></div>
        <form onsubmit="addIPAddress(event)">
            <div class="modal-body">
                <div style="display:flex; flex-direction:column; gap:16px;">
                    <div>
                        <label class="form-label">IP Address</label>
                        <input type="text" id="ipAddress" required class="form-input" placeholder="192.168.1.1/24">
                    </div>
                    <div>
                        <label class="form-label">Interface</label>
                        <select id="ipInterface" required class="form-select"></select>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" onclick="closeIPModal()" class="btn btn-ghost">Cancel</button>
                <button type="submit" class="btn btn-primary">Add</button>
            </div>
        </form>
    </div>
</div>
{{end}}
