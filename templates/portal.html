<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PisoWiFi Portal</title>
    <style>
        :root {
            --primary: #3b82f6;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f1f5f9;
            --text-secondary: #94a3b8;
            --border: #334155;
            --radius: 16px;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--bg) 0%, #1a1a2e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            padding: 20px;
        }
        .portal-container {
            width: 100%;
            max-width: 420px;
        }
        .portal-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 32px;
            border: 1px solid var(--border);
        }
        .portal-brand {
            text-align: center;
            margin-bottom: 24px;
        }
        .portal-brand h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .portal-brand p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }
        .rates-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
        }
        .rates-table th, .rates-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }
        .rates-table th {
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            font-weight: 600;
        }
        .rates-table td:first-child {
            font-weight: 600;
            color: var(--success);
        }
        .input-group {
            margin: 20px 0;
        }
        .input-group label {
            display: block;
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: var(--primary);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-primary:hover { background: #2563eb; }
        .btn-success {
            background: var(--success);
            color: white;
        }
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        .btn-warning {
            background: var(--warning);
            color: #1a1a2e;
        }
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        /* Session View */
        .session-view { text-align: center; }
        .countdown {
            font-size: 56px;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            margin: 24px 0;
            color: var(--success);
        }
        .countdown.low-time {
            color: var(--danger);
            animation: pulse 1s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .session-info {
            color: var(--text-secondary);
            font-size: 13px;
            margin-bottom: 20px;
        }
        .session-actions {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        .session-actions .btn { flex: 1; padding: 10px; font-size: 13px; }
        .coin-prompt {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 10px;
            padding: 12px;
            margin: 16px 0;
            font-size: 14px;
            color: var(--success);
        }
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            transition: opacity 0.3s;
        }
        .toast-success { background: var(--success); color: white; }
        .toast-error { background: var(--danger); color: white; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="portal-container">
        <!-- Landing View -->
        <div id="landingView" class="portal-card">
            <div class="portal-brand">
                <h1>PisoWiFi</h1>
                <p>Insert coin or enter voucher code</p>
            </div>

            <table class="rates-table">
                <thead>
                    <tr><th>Coin</th><th>Time</th></tr>
                </thead>
                <tbody id="ratesDisplay"></tbody>
            </table>

            <div class="input-group">
                <label>Voucher Code</label>
                <input type="text" id="voucherCode" placeholder="PW-XXXXXX" autocomplete="off" style="text-transform:uppercase;">
            </div>
            <button onclick="redeemVoucher()" class="btn btn-primary">Connect</button>
        </div>

        <!-- Session View -->
        <div id="sessionView" class="portal-card hidden">
            <div class="session-view">
                <div class="portal-brand">
                    <h1>PisoWiFi</h1>
                </div>
                <div class="countdown" id="countdown">00:00:00</div>
                <div class="session-info">
                    <span id="sessionStatus">Active Session</span>
                </div>

                <div class="coin-prompt">
                    Insert coin to add more time
                </div>

                <div class="session-actions">
                    <button onclick="pauseSession()" id="pauseBtn" class="btn btn-warning">Pause</button>
                    <button onclick="resumeSession()" id="resumeBtn" class="btn btn-success hidden">Resume</button>
                    <button onclick="addMoreVoucher()" class="btn btn-ghost">Add Time</button>
                    <button onclick="logoutSession()" class="btn btn-danger">Disconnect</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script>
        var routerID = {{.RouterID}};
        var currentSession = null;
        var countdownInterval = null;
        var macAddress = '';

        // Get MAC address from browser
        function initPortal() {
            loadRates();
            checkExistingSession();
        }

        function loadRates() {
            {{range .Rates}}
            addRateRow('{{.coin_value}}', '{{.time_seconds}}', '{{.label}}');
            {{end}}
        }

        function addRateRow(coin, seconds, label) {
            var tbody = document.getElementById('ratesDisplay');
            var tr = document.createElement('tr');
            var timeStr = formatSeconds(parseInt(seconds));
            tr.innerHTML = '<td>' + coin + ' Peso</td><td>' + (label || timeStr) + '</td>';
            tbody.appendChild(tr);
        }

        function formatSeconds(s) {
            if (s >= 86400) return Math.floor(s/86400) + 'd ' + Math.floor((s%86400)/3600) + 'h';
            if (s >= 3600) return Math.floor(s/3600) + 'h ' + Math.floor((s%3600)/60) + 'm';
            return Math.floor(s/60) + ' min';
        }

        function checkExistingSession() {
            if (!macAddress) return;
            fetch('/portal/' + routerID + '/session?mac=' + encodeURIComponent(macAddress))
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    if (data.active) {
                        currentSession = data.session;
                        showSessionView();
                    }
                });
        }

        function redeemVoucher() {
            var code = document.getElementById('voucherCode').value.trim();
            if (!code) { showToast('Enter a voucher code', true); return; }

            fetch('/portal/' + routerID + '/redeem', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({code: code, mac_address: macAddress, ip_address: ''})
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) { showToast(data.error, true); return; }
                currentSession = data.session;
                showToast('Connected! Enjoy your WiFi.');
                showSessionView();
            })
            .catch(function() { showToast('Connection failed', true); });
        }

        function showSessionView() {
            document.getElementById('landingView').classList.add('hidden');
            document.getElementById('sessionView').classList.remove('hidden');
            startCountdown();
        }

        function startCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);
            countdownInterval = setInterval(function() {
                if (!currentSession) return;
                fetch('/portal/' + routerID + '/session?mac=' + encodeURIComponent(macAddress))
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        if (data.active) {
                            currentSession = data.session;
                            var remaining = data.remaining_seconds;
                            var el = document.getElementById('countdown');
                            el.textContent = formatCountdown(remaining);
                            el.className = data.low_time ? 'countdown low-time' : 'countdown';
                            document.getElementById('sessionStatus').textContent = data.status === 'paused' ? 'Paused' : 'Active Session';
                            document.getElementById('pauseBtn').classList.toggle('hidden', data.status === 'paused');
                            document.getElementById('resumeBtn').classList.toggle('hidden', data.status !== 'paused');
                        } else {
                            clearInterval(countdownInterval);
                            showToast('Session expired', true);
                            document.getElementById('landingView').classList.remove('hidden');
                            document.getElementById('sessionView').classList.add('hidden');
                        }
                    });
            }, 5000);
        }

        function formatCountdown(seconds) {
            if (seconds <= 0) return '00:00:00';
            var h = Math.floor(seconds / 3600);
            var m = Math.floor((seconds % 3600) / 60);
            var s = seconds % 60;
            return pad(h) + ':' + pad(m) + ':' + pad(s);
        }

        function pad(n) { return n < 10 ? '0' + n : '' + n; }

        function pauseSession() {
            fetch('/portal/' + routerID + '/pause', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({mac_address: macAddress})
            }).then(function() { showToast('Session paused'); });
        }

        function resumeSession() {
            fetch('/portal/' + routerID + '/resume', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({mac_address: macAddress})
            }).then(function() { showToast('Session resumed'); });
        }

        function addMoreVoucher() {
            var code = prompt('Enter voucher code to add time:');
            if (!code) return;
            fetch('/portal/' + routerID + '/redeem', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({code: code.toUpperCase(), mac_address: macAddress, ip_address: ''})
            })
            .then(function(r) { return r.json(); })
            .then(function(data) {
                if (data.error) { showToast(data.error, true); return; }
                showToast('Time added!');
            });
        }

        function logoutSession() {
            if (!confirm('Disconnect from WiFi?')) return;
            fetch('/portal/' + routerID + '/logout', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({mac_address: macAddress})
            }).then(function() {
                clearInterval(countdownInterval);
                currentSession = null;
                document.getElementById('landingView').classList.remove('hidden');
                document.getElementById('sessionView').classList.add('hidden');
                showToast('Disconnected');
            });
        }

        function showToast(msg, isError) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + (isError ? 'toast-error' : 'toast-success');
            setTimeout(function() { t.classList.add('hidden'); }, 3000);
        }

        initPortal();
    </script>
</body>
</html>
